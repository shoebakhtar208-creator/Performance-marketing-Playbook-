        <li>When to optimise and when to scale</li>
      </ul>
      <div class="cta-row">
        <a class="btn btn-lg" href="YOUR_BUNDLE_PAYMENT_URL">GET BOTH PLAYBOOKS — ₹149</a>
        <a class="btn btn-ghost btn-lg" href="#books">GET INDIVIDUAL BOOK — ₹99</a>
      </div>
      <p class="fine">Instant digital access • Practical frameworks • 2026 Edition</p>
    </div>
    <div class="covers" aria-label="Both playbook covers">
      <img class="c1" src="data:image/jpeg;base64,
