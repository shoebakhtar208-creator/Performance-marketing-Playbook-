</header>

<main id="top">

<!-- 1. HERO -->
<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-copy">
      <p class="kicker">2026 Performance Marketing Playbooks</p>
      <h1>Stop guessing what’s wrong with your ads.</h1>
      <p class="lead">Two playbooks, one loop: <strong>Benchmark → Diagnose → Optimise → Scale.</strong> For marketers, media buyers, agencies, freelancers and founders who run paid campaigns.</p>
      <ul class="ticks">
        <li>What normal performance looks like</li>
        <li>Where your campaign is leaking</li>
